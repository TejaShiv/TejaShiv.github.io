name: Deploy site

# One repo, three destinations:
#   site/            -> /
#   site/learntej/   -> /learntej/   (copied as-is, no build)
#   portfolio/       -> /portfolio/  (built with Vite)
#
# Nothing built is committed. Push to main and this assembles it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so a half-published
# site never ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Build the React portfolio
        working-directory: portfolio
        run: |
          npm ci
          npm run build

      - name: Assemble
        run: |
          mkdir -p _site
          cp -R site/. _site/
          mkdir -p _site/portfolio
          cp -R portfolio/dist/. _site/portfolio/

          # Pages runs Jekyll by default, which drops files starting with
          # an underscore. Vite emits none, but this costs nothing.
          touch _site/.nojekyll

      - name: Check the three entry points exist
        run: |
          for f in _site/index.html _site/portfolio/index.html _site/learntej/index.html; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "all three present"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
